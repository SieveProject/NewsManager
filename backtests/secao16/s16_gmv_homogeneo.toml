# Seção 16 de docs/metodo_covariancia.md: GMV sem restrição (carteira principal); Σ̂ = fator + resíduo setor + BL notícias, Ω homogêneo (ablação descritiva).
name = "s16_gmv_homogeneo"
start = "2013-01-01"
end = "2023-12-31"
insample_days = 252
rebalance = "M"
benchmark = "SPY"
max_weight = inf
